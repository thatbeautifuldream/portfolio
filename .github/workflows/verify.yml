name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependency security
        run: pnpm audit

      - name: Verify (filenames, format, check, build)
        run: pnpm verify

      - name: Verify public contracts and migration parity
        run: pnpm test:filenames && pnpm test:libraries && pnpm test:content && pnpm test:i18n && pnpm test:migration && pnpm test:pwa
